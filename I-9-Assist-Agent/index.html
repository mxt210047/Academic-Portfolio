<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>I-9 Audit Agent · OnBlick</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --blue: #4a6dd9;
  --blue-soft: #e8eefc;
  --blue-border: #9bb0eb;
  --ink: #1a1d26;
  --muted: #6b7280;
  --line: #e5e7eb;
  --bg: #ffffff;
  --bg-soft: #f5f6f8;
  --danger: #dc2626;
  --danger-soft: #fee2e2;
  --success: #15803d;
  --success-soft: #dcfce7;
  --tech: #eab308;
  --subst: #4a6dd9;
  --shadow: 0 12px 40px rgba(26, 29, 38, 0.14);
  --radius: 8px;
  --font: "Plus Jakarta Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }

.app-header {
  height: 56px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  position: sticky;
  top: 0;
  z-index: 20;
}
.brand-product {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
}
.brand-product .agent { color: var(--blue); }
.onblick {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 15px;
}
.onblick-mark {
  width: 22px; height: 16px; position: relative;
}
.onblick-mark span {
  position: absolute; width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid;
}
.onblick-mark span:first-child { left: 0; top: 0; border-color: #e11d48; }
.onblick-mark span:last-child { right: 0; bottom: 0; border-color: var(--blue); }
.header-actions {
  display: flex; justify-content: flex-end; align-items: center; gap: 14px;
}
.icon-btn {
  width: 32px; height: 32px; border: 0; background: transparent; color: #4b5563;
  display: grid; place-items: center; border-radius: 999px;
}
.icon-btn:hover { background: var(--bg-soft); }
.avatar {
  width: 32px; height: 32px; border-radius: 999px; background: var(--blue);
  color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700;
}

.page { padding: 22px 28px 40px; min-height: calc(100vh - 56px); }
.page-title-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  margin-bottom: 18px;
}
.page-title { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.crumbs { color: var(--blue); font-size: 13px; margin-bottom: 10px; }
.crumbs button { border: 0; background: none; color: inherit; padding: 0; font: inherit; }
.meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
.meta .err { color: var(--danger); font-weight: 700; }

.btn {
  border-radius: 6px; border: 1px solid transparent; padding: 10px 16px;
  font-weight: 700; font-size: 13px; letter-spacing: 0.02em; display: inline-flex;
  align-items: center; gap: 8px; transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: #3b5bc4; box-shadow: 0 6px 16px rgba(74,109,217,.28); }
.btn-outline { background: #fff; color: var(--blue); border-color: var(--blue); }
.btn-outline:hover { background: var(--blue-soft); }
.btn-ghost { background: transparent; color: #374151; border: 0; font-weight: 600; }
.btn-sm { padding: 8px 12px; font-size: 12px; }

.empty {
  min-height: 62vh; display: grid; place-items: center; text-align: center;
  animation: fadeUp .45s ease both;
}
.empty-art { width: 220px; height: 160px; margin: 0 auto 18px; }
.empty h2 { margin: 0 0 16px; font-size: 18px; font-weight: 600; }

.toolbar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
}
.search {
  flex: 1; position: relative;
}
.search input {
  width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 10px 40px 10px 12px;
  outline: none;
}
.search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(74,109,217,.15); }
.search svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
.chip-btn {
  border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 10px 12px; color: #374151;
}

.table {
  width: 100%; border-collapse: collapse; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
}
.table th {
  text-align: left; background: #f3f4f6; color: #4b5563; font-size: 12px; font-weight: 600;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.table td {
  padding: 14px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle;
}
.table tr:last-child td { border-bottom: 0; }
.table tr { transition: background .15s ease; }
.table tbody tr:hover { background: #fafbff; cursor: pointer; }
.cell-name { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.folder, .person {
  width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center;
  background: var(--blue-soft); color: var(--blue); flex-shrink: 0;
}
.badge {
  display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 10px;
  font-size: 12px; font-weight: 600;
}
.badge-muted { background: #eef0f3; color: #4b5563; }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-ok { background: var(--success-soft); color: var(--success); }

.overlay {
  position: fixed; inset: 0; background: rgba(17,24,39,.45);
  display: grid; place-items: center; z-index: 40; padding: 20px;
  animation: fade .2s ease both;
}
.modal {
  width: min(560px, 100%); background: #fff; border-radius: 12px; box-shadow: var(--shadow);
  padding: 22px 22px 18px; animation: pop .25s ease both;
}
.modal.wide { width: min(640px, 100%); }
.modal-head {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;
}
.modal-head h3 { margin: 0; font-size: 18px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; color: #4b5563; margin-bottom: 6px; font-weight: 600; }
.field input {
  width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 11px 12px; outline: none;
}
.field input:focus { border-color: var(--blue); }
.drop {
  border: 1.5px dashed var(--blue-border); background: var(--blue-soft); border-radius: 10px;
  padding: 28px 16px; text-align: center; color: #374151;
}
.drop strong { color: var(--blue); text-decoration: underline; cursor: pointer; }
.drop .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.selected { margin-top: 14px; }
.selected h4 { margin: 0 0 8px; font-size: 13px; color: #4b5563; }
.folder-row {
  display: flex; align-items: center; gap: 10px; background: #f3f4f6; border-radius: 8px;
  padding: 10px 12px;
}
.folder-row .trash { margin-left: auto; border: 0; background: transparent; color: #ef4444; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

.confirm-art { width: 180px; height: 110px; margin: 0 auto 10px; display: block; }
.confirm-copy { text-align: center; margin: 0 0 18px; color: #374151; line-height: 1.5; }
.confirm-copy h3 { margin: 0 0 8px; font-size: 20px; }

.split {
  display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 16px;
  align-items: stretch; min-height: 70vh;
}
@media (max-width: 980px) {
  .split { grid-template-columns: 1fr; }
  .app-header { grid-template-columns: auto 1fr auto; gap: 8px; }
  .onblick span:last-child { display: none; }
}

.editor, .assist {
  border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden;
  display: flex; flex-direction: column; min-height: 620px;
}
.editor-toolbar {
  display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; background: #eef2ff; border-bottom: 1px solid var(--line);
}
.editor-toolbar button {
  width: 28px; height: 28px; border: 0; border-radius: 4px; background: transparent; color: #374151;
}
.editor-toolbar button:hover { background: #fff; }
.editor-body { padding: 18px; overflow: auto; flex: 1; }
.editor-body h4 { margin: 0 0 10px; }
.doc-meta {
  display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; font-weight: 700;
}
.info-table, .err-table { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-size: 13px; }
.info-table td, .err-table td, .err-table th {
  border: 1px solid var(--line); padding: 8px 10px; vertical-align: top;
}
.info-table td:first-child { width: 28%; font-weight: 700; background: #fafafa; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 16px; font-size: 13px; }
.swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.swatch.tech { background: var(--tech); }
.swatch.subst { background: var(--subst); }
.rec-box {
  background: #f3f4f6; border-radius: 8px; padding: 12px; font-size: 13px; margin: 10px 0 18px;
}
.rec-box .warn { color: var(--danger); font-weight: 700; }

.assist { border-color: var(--blue-border); background: linear-gradient(#fff, #f8faff); }
.assist-idle {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 24px 20px 12px; gap: 12px;
}
.assist-idle p { margin: 0; color: #374151; max-width: 280px; line-height: 1.45; font-size: 14px; }
.assist-chat {
  flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.bubble {
  max-width: 92%; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.45;
  animation: fadeUp .3s ease both;
}
.bubble.bot { background: var(--blue-soft); color: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble.user { background: var(--blue); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.bubble .tag { display: inline-block; font-size: 11px; font-weight: 700; margin-bottom: 4px; opacity: .8; }
.composer {
  border-top: 1px solid var(--line); padding: 12px; background: #fff;
}
.composer-row {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 6px 6px 14px; background: #fff;
}
.composer-row:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(74,109,217,.12); }
.composer-row input {
  flex: 1; border: 0; outline: none; background: transparent; font-size: 14px;
}
.send {
  width: 34px; height: 34px; border-radius: 999px; border: 0; background: var(--blue); color: #fff;
  display: grid; place-items: center;
}
.disclaimer { font-size: 11px; color: var(--muted); margin: 8px 2px 0; }

.hidden { display: none !important; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98);} to { opacity: 1; transform: none; } }
@keyframes floaty { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-6px);} }
.float { animation: floaty 3.2s ease-in-out infinite; }
</style>
</head>
<body>
  <header class="app-header">
    <div class="brand-product">I-9 Audit <span class="agent">Agent</span></div>
    <div class="onblick" aria-label="OnBlick">
      <div class="onblick-mark" aria-hidden="true"><span></span><span></span></div>
      <span>OnBlick</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" title="Help" aria-label="Help">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="7"/><path d="M7.2 7a2 2 0 013.7 1c0 1.2-1.8 1.5-1.8 3"/><circle cx="9" cy="13.2" r=".8" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" title="Notifications" aria-label="Notifications">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 13h10l-1.2-1.2V8a3.8 3.8 0 10-7.6 0v3.8L4 13z"/><path d="M7.5 14.5a1.5 1.5 0 003 0"/></svg>
      </button>
      <div class="avatar" title="Alyssa Wilson">AH</div>
    </div>
  </header>

  <main class="page" id="app"></main>

  <div id="modal-root"></div>

<script>
const state = {
  view: "empty", // empty | list | audit | assist
  orgName: "Schinner LLC",
  folders: ["Schinner LLC_all_employees_I9s"],
  showImport: false,
  showConfirm: false,
  search: "",
  selectedEmployee: null,
  chatStarted: false,
  messages: [],
};

const audits = [
  { id: "schinner", name: "Schinner LLC", employees: 100, documents: 2000, status: "Not Initiated" },
];

const employees = [
  { id: "marcus", name: "Marcus Reid", docs: 8, errors: 150 },
  { id: "alan", name: "Alan Langosh", docs: 13, errors: 150 },
  { id: "virginia", name: "Virginia Schuster", docs: 10, errors: 150 },
  { id: "manuel", name: "Manuel Lesch", docs: 10, errors: 150 },
  { id: "sophia", name: "Sophia Wells", docs: 15, errors: 0 },
  { id: "nina", name: "Nina Heller", docs: 5, errors: 0 },
  { id: "liam", name: "Liam Rosen", docs: 9, errors: 200 },
  { id: "olivia", name: "Olivia Mason", docs: 6, errors: 0 },
  { id: "ethan", name: "Ethan Patel", docs: 9, errors: 220 },
];

const emptyArt = `
<svg class="empty-art float" viewBox="0 0 240 170" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M40 110l30-18 28 20 34-28 36 24" stroke="#c7d2fe" stroke-width="3" fill="none"/>
  <path d="M70 70h70v70H70z" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="105" cy="92" r="12" stroke="#111" stroke-width="2"/>
  <path d="M88 118c6-10 28-10 34 0" stroke="#111" stroke-width="2"/>
  <path d="M84 78h42M84 128h30" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="145" cy="118" r="28" stroke="#111" stroke-width="3"/>
  <path d="M165 138l18 18" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <path d="M48 88c10-18 28-10 22 8-14 4-26 2-22-8z" fill="#4a6dd9"/>
  <path d="M168 54c12-14 26-6 18 10-12 5-24 2-18-10z" fill="#4a6dd9"/>
  <path d="M188 78c8-2 12 8 4 12-6-2-10-8-4-12z" stroke="#111" stroke-width="1.5"/>
</svg>`;

const confirmArt = `
<svg class="confirm-art" viewBox="0 0 200 120" fill="none" aria-hidden="true">
  <rect x="20" y="20" width="50" height="70" rx="4" fill="#e8eefc" stroke="#4a6dd9"/>
  <path d="M30 35h30M30 45h22M30 55h26" stroke="#4a6dd9"/>
  <rect x="80" y="18" width="55" height="75" rx="4" fill="#fff" stroke="#111"/>
  <path d="M92 40h30M92 52h24M92 64h28" stroke="#9ca3af"/>
  <circle cx="150" cy="78" r="18" fill="#4a6dd9" opacity=".15"/>
  <path d="M140 85c4-10 20-10 24 0" stroke="#111" stroke-width="2"/>
  <circle cx="152" cy="68" r="7" stroke="#111" stroke-width="2"/>
  <path d="M120 88h40" stroke="#111" stroke-width="2"/>
</svg>`;

const assistArt = `
<svg class="float" width="160" height="120" viewBox="0 0 160 120" fill="none" aria-hidden="true">
  <rect x="88" y="28" width="48" height="64" rx="6" fill="#e8eefc" stroke="#4a6dd9"/>
  <path d="M98 42h28M98 54h20M98 66h24" stroke="#4a6dd9"/>
  <circle cx="126" cy="78" r="8" fill="#4a6dd9"/>
  <path d="M123 78l2.2 2.2 4-4" stroke="#fff" stroke-width="1.6"/>
  <path d="M40 86c8-22 36-22 44 0" stroke="#111" stroke-width="2"/>
  <circle cx="62" cy="58" r="12" stroke="#111" stroke-width="2"/>
  <path d="M78 40l34 48" stroke="#4a6dd9" stroke-width="6" stroke-linecap="round"/>
  <path d="M108 84l8 12" stroke="#111" stroke-width="2"/>
</svg>`;

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function render() {
  const app = document.getElementById("app");
  const modal = document.getElementById("modal-root");
  app.innerHTML = "";
  modal.innerHTML = "";

  if (state.view === "empty") app.appendChild(viewEmpty());
  if (state.view === "list") app.appendChild(viewList());
  if (state.view === "audit") app.appendChild(viewAudit());
  if (state.view === "assist") app.appendChild(viewAssist());

  if (state.showImport) modal.appendChild(modalImport());
  if (state.showConfirm) modal.appendChild(modalConfirm());
}

function viewEmpty() {
  return el(`
  <section>
    <div class="page-title-row"><h1 class="page-title">I-9 Audits</h1></div>
    <div class="empty">
      <div>
        ${emptyArt}
        <h2>No Documents Found!</h2>
        <button class="btn btn-primary" id="import-cta">IMPORT I-9 DOCUMENTS</button>
      </div>
    </div>
  </section>`);
}

function viewList() {
  const q = state.search.trim().toLowerCase();
  const rows = audits.filter(a => a.name.toLowerCase().includes(q));
  const root = el(`
  <section>
    <div class="page-title-row">
      <h1 class="page-title">I-9 Audits</h1>
      <button class="btn btn-primary" id="import-cta">IMPORT I-9 DOCUMENTS</button>
    </div>
    <div class="toolbar">
      <div class="search">
        <input id="search" placeholder="Search audits" value="${state.search}" />
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
      </div>
      <button class="chip-btn">Filters ▾</button>
      <button class="chip-btn" title="Sort">A↓</button>
      <button class="chip-btn" title="Export">⇪</button>
    </div>
    <table class="table">
      <thead>
        <tr>
          <th style="width:36px"><input type="checkbox" aria-label="Select all" /></th>
          <th>Audit Name</th>
          <th>Employees</th>
          <th>Documents</th>
          <th>Audit Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(a => `
          <tr data-audit="${a.id}">
            <td><input type="checkbox" onclick="event.stopPropagation()" /></td>
            <td><div class="cell-name"><span class="folder">📁</span>${a.name}</div></td>
            <td>${a.employees} Employees</td>
            <td>${a.documents} Documents</td>
            <td><span class="badge badge-muted">${a.status}</span></td>
            <td><button class="btn btn-primary btn-sm initiate" data-id="${a.id}">INITIATE AUDIT</button></td>
          </tr>`).join("")}
      </tbody>
    </table>
  </section>`);
  return root;
}

function viewAudit() {
  const root = el(`
  <section>
    <div class="crumbs"><button data-nav="list">I-9 Audits</button> &gt; View Audit</div>
    <div class="page-title-row">
      <div>
        <h1 class="page-title">Schinner LLC</h1>
        <div class="meta">Initiated on 10/10/2025 • Initiated by Alyssa Wilson</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm">📊 VIEW ANALYTICS</button>
        <button class="chip-btn">⋮</button>
      </div>
    </div>
    <table class="table">
      <thead>
        <tr>
          <th>Employee Name</th>
          <th>Documents</th>
          <th>Audit Status</th>
          <th>Audit Note</th>
        </tr>
      </thead>
      <tbody>
        ${employees.map(e => `
          <tr data-emp="${e.id}">
            <td><div class="cell-name"><span class="person">👤</span>${e.name}</div></td>
            <td>${e.docs} Documents</td>
            <td>${e.errors
              ? `<span class="badge badge-danger">${e.errors} Errors Found</span>`
              : `<span class="badge badge-ok">No Errors Found</span>`}</td>
            <td><button class="icon-btn note" data-emp="${e.id}" title="Open audit notes">📄</button></td>
          </tr>`).join("")}
      </tbody>
    </table>
  </section>`);
  return root;
}

function viewAssist() {
  const emp = state.selectedEmployee || employees[1];
  const root = el(`
  <section>
    <div class="crumbs"><button data-nav="list">I-9 Audits</button> &gt; <button data-nav="audit">${emp.name}</button></div>
    <div class="page-title-row">
      <div>
        <h1 class="page-title">${emp.name}'s I-9 Audit Notes</h1>
        <div class="meta">Audit Completed on 10/10/2025 • <span class="err">${emp.errors || 0} Errors Found</span></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="chip-btn" title="Share">↗</button>
        <button class="btn btn-primary btn-sm">DOWNLOAD</button>
      </div>
    </div>
    <div class="split">
      <section class="editor">
        <div class="editor-toolbar" aria-label="Formatting">
          ${["B","I","U","•","1.","≡","A","🖍","{}","#"].map(t => `<button type="button">${t}</button>`).join("")}
        </div>
        <div class="editor-body">
          <div class="doc-meta"><span>Audit Notes/Report</span><span>Audit Date: 1-10-2023</span></div>
          <table class="info-table">
            <tr><td>Employee Name</td><td>${emp.name}</td></tr>
            <tr><td>Purpose</td><td>Form I-9 corrections</td></tr>
            <tr><td>Department</td><td>HR Department &amp; OnBlick (Form I-9 Review Services)</td></tr>
            <tr><td>Reviewed By</td><td>OnBlick</td></tr>
          </table>
          <p style="font-size:13px;line-height:1.5;color:#374151">
            Review steps: 1) Review &amp; Identify Errors, 2) Review Completeness, 3) Report issues requiring remediation.
          </p>
          <div class="legend">
            <span><i class="swatch tech"></i> Technical errors (correctable with initials/date)</span>
            <span><i class="swatch subst"></i> Substantive errors (usually requiring explanation or new I-9)</span>
          </div>
          <h4>Section-1 Errors</h4>
          <table class="err-table">
            <thead><tr><th>Errors</th><th>Error details</th></tr></thead>
            <tbody>
              <tr>
                <td><i class="swatch tech"></i> <strong>Employee Personnel Information</strong></td>
                <td>Middle Name, Other Last Names Used, Apt # fields is empty.</td>
              </tr>
              <tr>
                <td><i class="swatch subst"></i> <strong>Employee Signature &amp; Attestation</strong></td>
                <td>"Today's date" need to be ink and not to be digital on paper I-9.</td>
              </tr>
              <tr>
                <td><i class="swatch tech"></i> <strong>Others</strong></td>
                <td>Preparer or/and Translator field is empty. More than one Document field was completed. It is an "OR" requirement, so only one of the List A or List B+C fields is required.</td>
              </tr>
            </tbody>
          </table>
          <div class="rec-box">
            <div class="warn">Only employee is required to make the necessary corrections on the section-1 of the I-9.</div>
            <ul>
              <li>Enter N/A in unused Section 1 fields where appropriate.</li>
              <li>Do not backdate signatures; use the actual correction date with initials.</li>
              <li>Ensure attestation citizenship/immigration status is checked correctly.</li>
            </ul>
          </div>
          <h4>Section 2 Errors</h4>
          <table class="err-table">
            <thead><tr><th>Errors</th><th>Error details</th></tr></thead>
            <tbody>
              <tr>
                <td><i class="swatch subst"></i> <strong>LIST A Errors</strong></td>
                <td>Document details incomplete or List A combined improperly with List B/C.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <aside class="assist">
        ${state.chatStarted ? assistChat() : assistIdle()}
        <div class="composer">
          <div class="composer-row">
            <input id="ask" placeholder="Ask your question" />
            <button class="icon-btn" title="Voice" aria-label="Voice">🎤</button>
            <button class="send" id="send" title="Send" aria-label="Send">↑</button>
          </div>
          <div class="disclaimer">OnBlick Assistant may make mistakes. Please review its responses carefully. <a href="#">Share your feedback</a></div>
        </div>
      </aside>
    </div>
  </section>`);
  return root;
}

function assistIdle() {
  return `
  <div class="assist-idle" id="assist-idle">
    ${assistArt}
    <p>Ask <strong>OnBlick Audit Assistant</strong> to help you correct this employee's Form I-9 based on the errors identified in the audit.</p>
    <button class="btn btn-outline" id="start-correction">✨ Start Correction Recommendation</button>
  </div>`;
}

function assistChat() {
  const msgs = state.messages.map(m => `
    <div class="bubble ${m.role}">
      <div class="tag">${m.role === "bot" ? "OnBlick Audit Assistant" : "You"}</div>
      ${m.text}
    </div>`).join("");
  return `<div class="assist-chat" id="assist-chat">${msgs}</div>`;
}

function modalImport() {
  return el(`
  <div class="overlay" id="import-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title">
      <div class="modal-head">
        <h3 id="import-title">Import I-9 Documents</h3>
        <button class="icon-btn" id="close-import" aria-label="Close">✕</button>
      </div>
      <div class="field">
        <label>Organization Name *</label>
        <input id="org" value="${state.orgName}" placeholder="Enter" />
      </div>
      <div class="field">
        <label>Upload I-9 Document</label>
        <div class="drop" id="dropzone">
          <div style="font-size:28px;color:var(--blue)">📄</div>
          <div><strong id="link-upload">Link</strong> or drag and drop</div>
          <div class="hint">PDF, DOC, JPG or PNG (max. 25MB)</div>
        </div>
        <p class="note">Note: Please organize the folders by employee names within a master folder and upload the master folder here.</p>
      </div>
      <div class="selected">
        <h4>Selected Folders</h4>
        ${state.folders.map((f,i)=>`
          <div class="folder-row">
            <span>📁</span><span>${f}</span>
            <button class="trash" data-idx="${i}" aria-label="Remove">🗑</button>
          </div>`).join("") || `<div class="note">No folders selected yet.</div>`}
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="save-later">SAVE &amp; AUDIT LATER</button>
        <button class="btn btn-primary" id="initiate">INITIATE AUDIT</button>
      </div>
    </div>
  </div>`);
}

function modalConfirm() {
  return el(`
  <div class="overlay">
    <div class="modal wide" role="dialog" aria-modal="true">
      ${confirmArt}
      <div class="confirm-copy">
        <h3>Confirm I-9 Audit</h3>
        <p>You are about to initiate an I-9 audit for <strong>100 employees</strong> with <strong>4,000 documents.</strong> This process may take some time to complete.</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="exit-confirm">EXIT</button>
        <button class="btn btn-primary" id="yes-confirm">YES, CONFIRM</button>
      </div>
    </div>
  </div>`);
}

function botReply(prompt) {
  const p = (prompt || "").toLowerCase();
  if (p.includes("section 1") || p.includes("section-1")) {
    return `For Section 1 technical gaps (Middle Name / Other Last Names / Apt #), have the <strong>employee</strong> enter <em>N/A</em> where unused, then initial and date with today’s date. Do not backdate. Signature/attestation date on a paper I-9 must be wet-ink if that was the original medium.`;
  }
  if (p.includes("list a") || p.includes("section 2")) {
    return `Section 2 List A findings are usually substantive. Confirm either List A <em>or</em> List B+C — not both. Line through improper extra entries, initial and date. If the original reviewer can’t verify, complete a new Form I-9 and attach a dated memo.`;
  }
  return `I reviewed ${state.selectedEmployee?.name || "this employee"}’s audit notes. Priority fixes: (1) complete empty Section 1 identity fields with N/A where appropriate, (2) correct attestation/signature dating rules, (3) resolve List A vs B/C document recording. Say “Start Correction Recommendation” for a sequenced remediation plan.`;
}

function startCorrectionFlow() {
  state.chatStarted = true;
  state.messages = [
    {
      role: "bot",
      text: `Starting correction recommendations for <strong>${state.selectedEmployee.name}</strong>. I found ${state.selectedEmployee.errors} flagged issues. I’ll walk Section 1 technical items first, then substantive attestation and Section 2 document errors.`
    },
    {
      role: "bot",
      text: `<strong>Step 1 — Section 1 personnel fields:</strong> Ask the employee to fill Middle Name, Other Last Names Used, and Apt # (use N/A if not applicable). Employee initials + current date only.`
    },
    {
      role: "bot",
      text: `<strong>Step 2 — Signature & attestation:</strong> If the form is paper, ensure today’s date is wet-ink. Employer must not complete Section 1 fields.`
    },
  ];
  render();
}

function bind() {
  const app = document.getElementById("app");
  const modal = document.getElementById("modal-root");

  app.querySelector("#import-cta")?.addEventListener("click", () => {
    state.showImport = true; render();
  });
  app.querySelector("#search")?.addEventListener("input", (e) => {
    state.search = e.target.value; render();
    const s = document.getElementById("search"); s?.focus(); s?.setSelectionRange(s.value.length, s.value.length);
  });
  app.querySelectorAll(".initiate").forEach(btn => btn.addEventListener("click", (e) => {
    e.stopPropagation(); state.showConfirm = true; render();
  }));
  app.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => {
    state.view = b.getAttribute("data-nav");
    state.chatStarted = false; state.messages = [];
    render();
  }));
  app.querySelectorAll("[data-emp], .note").forEach(row => row.addEventListener("click", (e) => {
    const id = row.getAttribute("data-emp") || e.currentTarget.getAttribute("data-emp");
    state.selectedEmployee = employees.find(x => x.id === id) || employees[1];
    state.view = "assist";
    state.chatStarted = false; state.messages = [];
    render();
  }));
  app.querySelector("#start-correction")?.addEventListener("click", startCorrectionFlow);
  app.querySelector("#send")?.addEventListener("click", sendAsk);
  app.querySelector("#ask")?.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendAsk();
  });

  modal.querySelector("#close-import")?.addEventListener("click", () => { state.showImport = false; render(); });
  modal.querySelector("#import-overlay")?.addEventListener("click", (e) => {
    if (e.target.id === "import-overlay") { state.showImport = false; render(); }
  });
  modal.querySelector("#link-upload")?.addEventListener("click", () => {
    if (!state.folders.length) state.folders = ["Schinner LLC_all_employees_I9s"];
    render();
  });
  modal.querySelector("#dropzone")?.addEventListener("click", () => {
    if (!state.folders.length) state.folders = ["Schinner LLC_all_employees_I9s"];
    render();
  });
  modal.querySelectorAll(".trash").forEach(btn => btn.addEventListener("click", () => {
    state.folders.splice(+btn.dataset.idx, 1); render();
  }));
  modal.querySelector("#save-later")?.addEventListener("click", () => {
    const org = document.getElementById("org");
    state.orgName = org?.value || state.orgName;
    audits[0].name = state.orgName;
    state.showImport = false;
    state.view = "list";
    render();
  });
  modal.querySelector("#initiate")?.addEventListener("click", () => {
    const org = document.getElementById("org");
    state.orgName = org?.value || state.orgName;
    state.showImport = false;
    state.showConfirm = true;
    render();
  });
  modal.querySelector("#exit-confirm")?.addEventListener("click", () => {
    state.showConfirm = false;
    state.view = "list";
    render();
  });
  modal.querySelector("#yes-confirm")?.addEventListener("click", () => {
    state.showConfirm = false;
    audits[0].status = "In Progress";
    state.view = "audit";
    render();
  });
}

function sendAsk() {
  const input = document.getElementById("ask");
  const text = (input?.value || "").trim();
  if (!text) return;
  if (!state.chatStarted) state.chatStarted = true;
  state.messages.push({ role: "user", text });
  state.messages.push({ role: "bot", text: botReply(text) });
  render();
  const chat = document.getElementById("assist-chat");
  chat?.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
}

const _render = render;
render = function() { _render(); bind(); };
render();
</script>
</body>
</html>
